[project]
name = "iwalk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kamil Adamczyk", email = "limacz@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=1.38.1",
    "pyexiftool>=0.5.6",
]

[project.scripts]
iwalk = "iwalk:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
]
